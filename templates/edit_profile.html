{% extends "layout.html" %}

{% block title %}
Edit Profile | Wardshabdam
{% endblock %}

{% block content %}

<div class="form-card" style="max-width: 600px; margin: 40px auto; padding: 32px 28px; background: #FFFFFF; border-radius: var(--radius-lg); border: 1px solid var(--border-light); box-shadow: var(--shadow-md);">

    <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 4px;">
            <i class="fa-solid fa-user-pen" style="color: var(--brand-primary); margin-right: 6px;"></i>
            പ്രൊഫൈൽ വിവരങ്ങൾ പുതുക്കുക
        </h2>
        <p style="color: var(--text-muted); font-size: 14px; margin: 0;">Update Citizen & Household Details</p>
    </div>

    <form method="POST">

        <div class="form-group">
            <label><i class="fa-solid fa-user" style="color: var(--brand-primary); margin-right: 6px;"></i> മുഴുവൻ പേര് / Full Name *</label>
            <input type="text" name="fullname" value="{{ citizen.fullname }}" required>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-phone" style="color: var(--brand-primary); margin-right: 6px;"></i> മൊബൈൽ നമ്പർ / Mobile Number</label>
            <input type="text" value="{{ citizen.mobile }}" readonly style="background: var(--bg-surface-subtle); color: var(--text-muted); cursor: not-allowed;">
            <small style="color: var(--text-muted); font-size: 11px;">മൊബൈൽ നമ്പർ മാറ്റുവാൻ പഞ്ചായത്ത് ഓഫീസുമായി ബന്ധപ്പെടുക.</small>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-envelope" style="color: var(--brand-primary); margin-right: 6px;"></i> ഇമെയിൽ / Email Address</label>
            <input type="email" name="email" value="{{ citizen.email or '' }}" placeholder="example@gmail.com">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
                <label><i class="fa-solid fa-house" style="color: var(--brand-primary); margin-right: 6px;"></i> വീട്ടു നമ്പർ / House No</label>
                <input type="text" name="house_no" value="{{ citizen.house_no or '' }}" placeholder="ഉദാ: 12/345">
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-id-card" style="color: var(--brand-primary); margin-right: 6px;"></i> റേഷൻ കാർഡ് നമ്പർ</label>
                <input type="text" name="ration_card_no" value="{{ citizen.ration_card_no or '' }}" placeholder="Ration Card No">
            </div>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 16px;">
            <a href="/profile" style="flex: 1; text-align: center; background: var(--bg-surface-subtle); color: var(--text-secondary); text-decoration: none; padding: 12px; border-radius: var(--radius-md); font-weight: 700; border: 1px solid var(--border-light);">
                റദ്ദാക്കുക / Cancel
            </a>
            <button type="submit" class="submit-btn" style="flex: 2; padding: 12px; background: var(--brand-primary); color: #FFFFFF; border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 700; cursor: pointer;">
                മാറ്റങ്ങൾ സൂക്ഷിക്കുക / Save
            </button>
        </div>

    </form>

</div>

{% endblock %}
